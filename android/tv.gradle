// Keep downstream packaging independent from upstream's Android build file.
def tvRelease = new groovy.json.JsonSlurper().parse(new File(rootDir, "../tool/tv/release.json"))
def tvAndroidVersionBase = (System.getenv("KAZUMI_TV_ANDROID_VERSION_BASE") ?:
        tvRelease.androidVersionBase.toString()).toInteger()
if (tvAndroidVersionBase <= 0 || tvAndroidVersionBase > 210000000) {
    throw new GradleException("TV Android version base is out of range")
}
android {
    flavorDimensions "presentation"
    productFlavors {
        livingroom {
            dimension "presentation"
            applicationId "com.fenghaha.kazumitv"
            // Android install sequence is TV-only. pubspec and upstream rule
            // version/API stay unchanged; app/build.gradle adds the ABI digit.
            versionCode tvAndroidVersionBase
        }
    }
    def signingPath = System.getenv("KAZUMI_TV_KEY_PROPERTIES")
    if (signingPath) {
        def signing = new Properties()
        new File(signingPath).withInputStream { signing.load(it) }
        signingConfigs {
            livingroom {
                storeFile new File(signing["storeFile"])
                storePassword signing["storePassword"]
                keyAlias signing["keyAlias"]
                keyPassword signing["keyPassword"]
            }
        }
        // buildType wins over flavor signing; override upstream's debug key.
        buildTypes.release.signingConfig signingConfigs.livingroom
        // A profile build must upgrade the installed TV app without deleting
        // its data. It uses the same external signing material as release.
        buildTypes.configureEach { type ->
            if (type.name == "profile") type.signingConfig signingConfigs.livingroom
        }
    }
}

// The upstream ARM32 bundle builds TLS without -O2. Replace only this library
// before stripping/signing; every other ABI and the unflavored app stay upstream.
def kernelSpecFile = new File(rootDir, "../tool/tv/native/kernel.json")
def kernelFile = new File(System.getenv("KAZUMI_TV_ARM32_LIBMPV") ?:
        new File(rootDir, "../build/native/armeabi-v7a/libmpv.so").path)
def allowUpstreamKernel = System.getenv("KAZUMI_TV_ALLOW_UPSTREAM_KERNEL") == "1"
tasks.configureEach { task ->
    if (task.name in ["mergeLivingroomReleaseNativeLibs", "mergeLivingroomProfileNativeLibs"]) {
        task.inputs.file(kernelSpecFile).withPropertyName("tvKernelSpec")
        task.inputs.property("tvAllowUpstreamKernel", allowUpstreamKernel)
        task.inputs.property("tvKernelPresent", kernelFile.isFile())
        if (kernelFile.isFile()) {
            task.inputs.file(kernelFile).withPropertyName("tvArm32Kernel")
        }
        task.doLast {
            def target = new File(task.outputDir.get().asFile, "lib/armeabi-v7a/libmpv.so")
            if (!target.isFile() || allowUpstreamKernel) return
            if (!kernelFile.isFile()) {
                throw new GradleException("ARM32 TV kernel missing. Run tool/tv/native/build_kernel.py or set KAZUMI_TV_ARM32_LIBMPV to the verified release library. See tool/tv/native/README.md.")
            }
            def spec = new groovy.json.JsonSlurper().parse(kernelSpecFile)
            def expected = spec.reviewedLibraries["armeabi-v7a"]?.sha256
            def bytes = kernelFile.bytes
            def hash = java.security.MessageDigest.getInstance("SHA-256").digest(bytes).encodeHex().toString()
            if (!expected || hash != expected || bytes.length < 20 ||
                    bytes[0] != 127 || bytes[1] != 69 || bytes[2] != 76 || bytes[3] != 70 ||
                    bytes[4] != 1 || bytes[5] != 1 || bytes[18] != 40 || bytes[19] != 0) {
                throw new GradleException("ARM32 TV kernel hash/ELF architecture differs from the reviewed native manifest")
            }
            java.nio.file.Files.copy(kernelFile.toPath(), target.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
    }
}
